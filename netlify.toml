# This is a monorepo — the frontend lives in frontend/, not the repo root.
# `publish` IS relative to `base` (confirmed by an actual failed deploy: a
# fully-qualified "frontend/dist" here doubled up to
# frontend/frontend/dist, since Netlify already prefixes base). The
# dashboard's "New site" form field showing something odd during initial
# setup was a red herring — this committed config is what actually governs
# the build (resolved config logs show publishOrigin/commandOrigin: config),
# not whatever's typed in the dashboard.
[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

# Client-side routing (react-router-dom) means routes like /trips/29 only
# exist in the browser, not as real files — without this, refreshing or
# deep-linking to any non-root route 404s on Netlify. VITE_API_URL is set
# as a build-time environment variable in the Netlify dashboard, not here
# (it's deployment-specific, shouldn't be committed).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
